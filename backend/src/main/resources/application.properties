spring.application.name=nagarik
server.port=8080

# Postgres. The defaults match docker-compose.yml at the repository root, so
# "docker compose up -d" then "mvn spring-boot:run" works with no further setup.
# Every value can be overridden with an environment variable, which is how you
# point this at a managed database without editing the file.
spring.datasource.url=jdbc:postgresql://ep-noisy-voice-az670o1o-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_PVwNe3DdM4bG

# Hibernate creates and alters tables to match the entities. That is the right
# trade for a prototype. Before this carries real data, move the schema into
# Flyway migrations and set this to "validate" so an accidental entity change
# can never silently rewrite a live table.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Postgres does not need the connection tested on every checkout, but it does
# benefit from a pool small enough to sit inside its default 100 connections.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Send timestamps as ISO-8601 strings rather than epoch numbers.
spring.jackson.serialization.write-dates-as-timestamps=false

# Signing key for the login tokens. HS256 needs at least 32 bytes or the JWT
# library refuses to sign, so a short value fails at startup with a message
# naming this property rather than at the first login. Generate one with:
#
#   openssl rand -base64 48
#
# The default below is a development value and is deliberately not a secret.
# Set NAGARIK_JWT_SECRET before this serves anything real: anyone holding this
# string can mint a token for any account.
nagarik.jwt.secret=${NAGARIK_JWT_SECRET:bG9jYWwtZGV2LW9ubHktc2VjcmV0LW5hZ2FyaWstY2hhbmdlLW1lLWJlZm9yZS1zaGlwcGluZw==}

# How long a token stays valid. 168 hours is a week - long enough that people
# are not asked to sign in constantly, and the only thing limiting a stolen
# token, since there is no server-side session to revoke.
nagarik.jwt.expiry-hours=${NAGARIK_JWT_EXPIRY_HOURS:168}

